name: XingyunMusic
options:
  bundleIdPrefix: com.xingyun
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  XingyunMusic:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: XingyunMusic
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_NAME: XingyunMusic
        PRODUCT_BUNDLE_IDENTIFIER: com.xingyun.music
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 星云音乐
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于可能的录音功能
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
      gatherCoverageData: false
