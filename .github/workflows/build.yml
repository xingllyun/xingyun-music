name: build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 同一分支/tag 的重复触发只保留最新一次，避免快速连续提交造成的重复构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # iOS：macOS 出未签名 IPA（§14.2）
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tag 推送时直接用 tag 名命名产物，保证发行版内文件名一致
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // "v0.0.0"')
            base=${latest#v}
            IFS='.' read -r major minor patch <<< "$base"
            echo "version=v${major}.${minor}.$((patch+1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild -project XingyunMusic.xcodeproj -scheme XingyunMusic \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            CONFIGURATION_BUILD_DIR=$PWD/build clean build

      - name: Package unsigned IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/XingyunMusic.app Payload/
          zip -qr "XingyunMusic-${{ steps.version.outputs.version }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/*.ipa

  # Android：Ubuntu 出 APK（§14.3）
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  # 后端：JDK17 + Maven 编译打包（§12 / §14）
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build backend
        run: cd backend && mvn -B package -DskipTests --no-transfer-progress

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/xingyun-music-server.jar

  # tag 时统一发布 Release，多附件（§14.4）
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-ios, build-android, build-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/ios-ipa/*.ipa \
            artifacts/android-apk/*.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes
